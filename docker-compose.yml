services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tgt_app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    volumes:
      - .:/var/www/html
    networks:
      - tgt_network

  webserver:
    image: nginx:alpine
    container_name: tgt_webserver
    restart: unless-stopped
    tty: true
    ports:
      - "8888:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - tgt_network

  db:
    image: mysql:8.0
    container_name: tgt_db
    restart: unless-stopped
    tty: true
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: tgt_esim
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_USER: tgt_user
      MYSQL_PASSWORD: tgt_password
    volumes:
      - tgt_dbdata:/var/lib/mysql
    networks:
      - tgt_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: tgt_phpmyadmin
    restart: unless-stopped
    ports:
      - "8889:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: secretpassword
    networks:
      - tgt_network

networks:
  tgt_network:
    driver: bridge

volumes:
  tgt_dbdata:
    driver: local
